 <text x="335" y="528" class="tag">NLP · PYTHON · MACHINE LEARNING</text><text x="335" y="546" class="small silver">GITHUB / ARABIC-SENTIMENT ↗</text>
</g>
<!-- Project 6 -->
<g class="project" style="animation-delay:.85s">
 <rect class="card" x="600" y="348" width="270" height="210" rx="15"/><rect class="edge" x="600" y="348" width="270" height="210" rx="15"/>
 <text x="620" y="376" class="small muted">06 / SOFTWARE DEVELOPMENT</text><text x="848" y="381" text-anchor="end" class="num">06</text>
 <text x="620" y="411" class="icon">▣</text><text x="654" y="408" class="heading">PHARMACY</text><text x="654" y="426" class="heading">MANAGEMENT SYSTEM</text>
