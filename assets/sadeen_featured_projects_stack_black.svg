 <text x="620" y="528" class="tag">JAVA · OOP · ENCAPSULATION</text><text x="620" y="546" class="small silver">GITHUB / PHARMACY-SYSTEM ↗</text>
</g>
<path d="M30 588H870" stroke="#555"/>
<text x="30" y="615" class="small muted">THINK // EXPERIMENT // BUILD // INNOVATE</text>
<text x="870" y="615" text-anchor="end" class="small silver">PROJECTS STATUS: ACTIVE</text>
<rect x="0" y="0" width="900" height="2" fill="#DDD" opacity=".1" class="scan"/>
</svg>