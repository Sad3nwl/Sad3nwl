 <text x="620" y="235" class="desc">Interactive automotive analytics</text><text x="620" y="252" class="desc">dashboard with KPIs, dynamic</text><text x="620" y="269" class="desc">filters and data visualizations.</text>
 <text x="620" y="298" class="tag">PYTHON · PLOTLY · STREAMLIT</text><text x="620" y="316" class="small silver">GITHUB / CARINSIGHT-DASHBOARD ↗</text>
</g>
<!-- Project 4 -->
<g class="project" style="animation-delay:.55s">
 <rect class="card" x="30" y="348" width="270" height="210" rx="15"/><rect class="edge" x="30" y="348" width="270" height="210" rx="15"/>
 <text x="50" y="376" class="small muted">04 / NATURAL LANGUAGE PROCESSING</text><text x="278" y="381" text-anchor="end" class="num">04</text>
 <text x="50" y="411" class="icon">▤</text><text x="84" y="408" class="heading">NEWS</text><text x="84" y="426" class="heading">CLASSIFICATION</text>
 <path d="M50 441H280" stroke="#414141"/>
 <text x="50" y="465" class="desc">News article classification using</text><text x="50" y="482" class="desc">TF-IDF feature extraction and</text><text x="50" y="499" class="desc">Machine Learning algorithms.</text>
 <text x="50" y="528" class="tag">NLP · TF-IDF · MACHINE LEARNING</text><text x="50" y="546" class="small silver">GITHUB / NEWS-CLASSIFICATION ↗</text>
</g>
<!-- Project 5 -->
<g class="project" style="animation-delay:.7s">
 <rect class="card" x="315" y="348" width="270" height="210" rx="15"/><rect class="edge" x="315" y="348" width="270" height="210" rx="15"/>
 <text x="335" y="376" class="small muted">05 / NLP · ARABIC AI</text><text x="563" y="381" text-anchor="end" class="num">05</text>
 <text x="335" y="411" class="icon">◌</text><text x="369" y="408" class="heading">ARABIC SENTIMENT</text><text x="369" y="426" class="heading">ANALYSIS</text>
 <path d="M335 441H565" stroke="#414141"/>
