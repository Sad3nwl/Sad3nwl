 <text x="335" y="146" class="small muted">02 / GENERATIVE AI</text><text x="563" y="151" text-anchor="end" class="num">02</text>
 <text x="335" y="181" class="icon">⌘</text><text x="369" y="178" class="heading">ARABIC RAG</text><text x="369" y="196" class="heading">WIKIPEDIA</text>
 <path d="M335 211H565" stroke="#414141"/>
 <text x="335" y="235" class="desc">Arabic Retrieval-Augmented</text><text x="335" y="252" class="desc">Generation with source-grounded</text><text x="335" y="269" class="desc">answers from Wikipedia articles.</text>
 <text x="335" y="298" class="tag">LANGCHAIN · CHROMADB</text><text x="335" y="316" class="small silver">GITHUB / ARABIC-RAG-WIKIPEDIA ↗</text>
</g>
<!-- Project 3 -->
