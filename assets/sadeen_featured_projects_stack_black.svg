<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Sadeen's Featured Projects">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050505"/>
    <stop offset=".55" stop-color="#101010"/>
    <stop offset="1" stop-color="#191919"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#777777"/><stop offset=".5" stop-color="#F0F0F0"/><stop offset="1" stop-color="#888888"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#0B0B0B"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#555" stroke-width=".45" opacity=".16"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#E8E8E8}
    .muted{fill:#858585}.silver{fill:#D8D8D8}
    .card{fill:url(#panel);stroke:#444;stroke-width:1}
    .heading{font-size:13px;font-weight:700;letter-spacing:.5px;fill:#F0F0F0}
    .desc{font-size:11px;fill:#B8B8B8}
    .tag{font-size:9px;fill:#C5C5C5;letter-spacing:.3px}
    .small{font-size:9px;letter-spacing:1.1px}
    .project{opacity:0;animation:appear .8s ease forwards}
    @keyframes appear{to{opacity:1}}
    .edge{fill:none;stroke:url(#silver);stroke-width:1.2;stroke-dasharray:42 520;animation:edge 7s linear infinite;opacity:.8}
    @keyframes edge{to{stroke-dashoffset:-562}}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(650px)}}
    .num{font-size:26px;font-weight:300;fill:#777}
    .icon{font-size:23px;fill:#D5D5D5}
  </style>
</defs>
<rect width="900" height="650" rx="18" fill="url(#bg)"/>
<rect width="900" height="650" rx="18" fill="url(#grid)"/>
<path d="M28 26H872" stroke="#555" opacity=".65"/>
<text x="30" y="55" font-size="21" font-weight="700" letter-spacing="2.2">FEATURED PROJECTS</text>
<text x="870" y="53" text-anchor="end" class="small muted">S ADEEN // PORTFOLIO 2026</text>
<path d="M30 72H870" stroke="url(#silver)" stroke-width="1.3" opacity=".75"/>
<text x="30" y="96" class="small muted">AI · DATA SCIENCE · SOFTWARE DEVELOPMENT</text>
<text x="870" y="96" text-anchor="end" class="small silver">06 SELECTED WORKS <tspan class="pulse">●</tspan></text>

<!-- Project 1 -->
<g class="project" style="animation-delay:.1s">
 <rect class="card" x="30" y="118" width="270" height="210" rx="15"/>
 <rect class="edge" x="30" y="118" width="270" height="210" rx="15"/>
 <text x="50" y="146" class="small muted">01 / DEEP LEARNING</text><text x="278" y="151" text-anchor="end" class="num">01</text>
 <text x="50" y="181" class="icon">◉</text><text x="84" y="178" class="heading">BRAIN TUMOR</text><text x="84" y="196" class="heading">DETECTION &amp; XAI</text>
 <path d="M50 211H280" stroke="#414141"/>
 <text x="50" y="235" class="desc">Brain tumor classification using</text><text x="50" y="252" class="desc">MobileNetV2 Transfer Learning,</text><text x="50" y="269" class="desc">with Grad-CAM explainability.</text>
 <text x="50" y="298" class="tag">MOBILENETV2 · GRAD-CAM</text>
 <text x="50" y="316" class="small silver">GITHUB / BRAIN-TUMOR-DETECTION ↗</text>
</g>
