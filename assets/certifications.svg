    <rect class="card" x="554" y="72" width="254" height="112" rx="5"></rect>
    <path class="glow" d="M554 96 V77 Q554 72 559 72 H584"></path>
    <text x="571" y="96" class="tag">03 / CERTIFICATION</text>
    <text x="571" y="120" class="title">Python for Data Science,</text>
