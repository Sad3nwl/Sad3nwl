    <text x="300" y="126" class="title">Azure AI Certification</text>
    <line x1="300" y1="145" x2="520" y2="145" class="line"></line>
    <text x="300" y="165" class="issuer">MICROSOFT</text>
    <circle cx="518" cy="91" r="3" class="dot"></circle>
  </g>

