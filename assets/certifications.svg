    <path class="glow" d="M12 226 V207 Q12 202 17 202 H42"></path>
    <text x="29" y="226" class="tag">04 / CERTIFICATION</text>
    <text x="29" y="250" class="title">Databases and SQL for</text>
    <text x="29" y="268" class="title">Data Science with Python</text>
    <line x1="29" y1="281" x2="249" y2="281" class="line"></line>
    <text x="29" y="300" class="issuer">IBM  /  COURSERA</text>
  </g>

  <!-- Card 5 -->
  <g class="cardgroup" style="animation-delay:.5s">
    <rect class="card" x="283" y="202" width="254" height="112" rx="5"></rect>
    <path class="glow" d="M283 226 V207 Q283 202 288 202 H313"></path>
    <text x="300" y="226" class="tag">05 / CERTIFICATION</text>
    <text x="300" y="256" class="title">Data Analysis with Python</text>
    <line x1="300" y1="281" x2="520" y2="281" class="line"></line>
    <text x="300" y="300" class="issuer">IBM  /  COURSERA</text>
  </g>

  <!-- Card 6 -->
  <g class="cardgroup" style="animation-delay:.6s">
    <rect class="card" x="554" y="202" width="254" height="112" rx="5"></rect>
    <path class="glow" d="M554 226 V207 Q554 202 559 202 H584"></path>
    <text x="571" y="226" class="tag">06 / CERTIFICATION</text>
    <text x="571" y="256" class="title">Object-Oriented</text>
    <text x="571" y="274" class="title">Programming Paradigm</text>
    <line x1="571" y1="281" x2="791" y2="281" class="line"></line>
    <text x="571" y="300" class="issuer">HTUx</text>
  </g>

  <!-- Card 7 -->
  <g class="cardgroup" style="animation-delay:.7s">
    <rect class="card" x="283" y="332" width="254" height="112" rx="5"></rect>
    <path class="glow" d="M283 356 V337 Q283 332 288 332 H313"></path>
    <text x="300" y="356" class="tag">07 / CERTIFICATION</text>
    <text x="300" y="380" class="title">Introduction: Setup</text>
    <text x="300" y="398" class="title">Development Environment</text>
    <line x1="300" y1="411" x2="520" y2="411" class="line"></line>
    <text x="300" y="430" class="issuer">HTUx</text>
  </g>

  <text x="22" y="462" class="muted" font-size="9" letter-spacing="1">CONTINUOUS LEARNING  //  BUILDING THE FUTURE</text>
  <text x="798" y="462" text-anchor="end" fill="#42D9FF" font-size="9">S.A. 2026</text>
