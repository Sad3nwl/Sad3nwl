
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-label="Certifications and Leadership">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326"></stop>
      <stop offset="1" stop-color="#0B2342"></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0877C9"></stop>
      <stop offset="1" stop-color="#42D9FF"></stop>
    </linearGradient>
    <style>
      text { font-family: 'Courier New', monospace; fill: #E6F4FF; }
      .muted { fill: #8BAAC8; }
      .card { fill: #0B1D35; stroke: #17466C; stroke-width: 1.2; }
      .title { font-size: 13px; font-weight: bold; }
      .issuer { font-size: 10px; fill: #65CFFF; letter-spacing: 1px; }
      .tag { font-size: 9px; fill: #8BAAC8; letter-spacing: 1px; }
      .glow { fill: none; stroke: #35BFFF; stroke-width: 1.5; opacity: .65; }
      .dot { fill: #42D9FF; }
      .cardgroup { opacity: 0; animation: appear .7s ease forwards; }
      @keyframes appear { to { opacity: 1; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      .line { stroke: #17466C; stroke-width: 1; }
    </style>
  </defs>

  <rect width="820" height="470" rx="8" fill="url(#bg)"></rect>
  <path d="M18 55 H802" stroke="url(#accent)" stroke-width="1.5"></path>
  <text x="22" y="31" font-size="17" font-weight="bold" letter-spacing="2">CERTIFICATIONS &amp; LEADERSHIP</text>
  <text x="800" y="31" text-anchor="end" class="muted" font-size="10">[ 07 ACHIEVEMENTS ]</text>
  <circle cx="790" cy="17" r="3" class="dot pulse"></circle>

  <!-- Card 1 -->
  <g class="cardgroup" style="animation-delay:.1s">
    <rect class="card" x="12" y="72" width="254" height="112" rx="5"></rect>
    <path class="glow" d="M12 96 V77 Q12 72 17 72 H42"></path>
    <text x="29" y="96" class="tag">01 / LEADERSHIP</text>
    <text x="29" y="126" class="title">Event Organizer</text>
    <line x1="29" y1="145" x2="249" y2="145" class="line"></line>
    <text x="29" y="165" class="issuer">AL-ZAYTOONAH UNIVERSITY</text>
    <circle cx="247" cy="91" r="3" class="dot"></circle>
  </g>

  <!-- Card 2 -->
