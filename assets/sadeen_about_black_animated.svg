<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Sadeen Abdelalrahman | About</title>
<desc id="desc">A black futuristic animated AI profile with a glowing neural hologram and Sadeen's education, interests, and learning focus. No GPA displayed.</desc>
<defs>
  <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050608"/><stop offset=".55" stop-color="#0b0e12"/><stop offset="1" stop-color="#020304"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5f7fa"/><stop offset=".5" stop-color="#9da8b5"/><stop offset="1" stop-color="#e4e9ef"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#9bbbd7" stop-opacity=".18"/><stop offset="1" stop-color="#9bbbd7" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#a7b2bf" stroke-opacity=".055"/>
  </pattern>
  <clipPath id="brainClip"><path d="M660 148C624 126 578 150 573 188C538 199 534 240 554 261C533 296 558 334 588 334C595 367 632 376 655 352C681 379 718 367 728 340C765 349 794 319 780 285C807 255 785 215 755 211C748 173 704 143 675 160Z"/></clipPath>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#eef2f6}
  .white{fill:#f2f5f8}.silver{fill:#b9c2cc}.dim{fill:#78838f}
  .stroke{stroke:#9aa7b5}.panel{fill:#0b0e12;fill-opacity:.82;stroke:#56616d;stroke-opacity:.65;stroke-width:1.2}
  .softline{fill:none;stroke:#aeb9c5;stroke-opacity:.42;stroke-width:1.2}
  .glow{filter:url(#softGlow)}
  .float{animation:float 5s ease-in-out infinite}
  .orbit{transform-origin:670px 270px;animation:spin 26s linear infinite}
  .orbit2{transform-origin:670px 270px;animation:spin 19s linear infinite reverse}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .dash{stroke-dasharray:5 12;animation:dash 14s linear infinite}
  .scan{animation:scan 6s ease-in-out infinite}
  .twinkle{animation:twinkle 3s ease-in-out infinite}
  .delay1{animation-delay:.8s}.delay2{animation-delay:1.6s}.delay3{animation-delay:2.2s}
  .cursor{animation:blink .9s steps(2) infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-240}}
  @keyframes scan{0%{transform:translateY(0);opacity:0}20%{opacity:.5}80%{opacity:.5}100%{transform:translateY(400px);opacity:0}}
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.9;transform:scale(1.25)}}
  @keyframes blink{50%{opacity:0}}
</style>

<!-- Seamless black canvas with soft rounded silhouette -->
<rect width="1200" height="620" rx="34" fill="url(#black)"/>
<rect width="1200" height="620" rx="34" fill="url(#microgrid)"/>
<ellipse cx="675" cy="285" rx="370" ry="290" fill="url(#halo)"/>
<rect x="2" y="2" width="1196" height="616" rx="32" fill="none" stroke="#8e9aa7" stroke-opacity=".35" stroke-width="1.5"/>
<path d="M32 76H1168" stroke="#697582" stroke-opacity=".4"/>

<!-- Header: minimal rounded identity bar -->
<rect x="30" y="22" width="330" height="38" rx="19" fill="#11161c" stroke="#697582" stroke-opacity=".5"/>
<circle cx="51" cy="41" r="4" fill="#e7edf3" class="pulse"/>
<text x="68" y="46" font-size="14" letter-spacing="1.8" class="silver">SADEEN@AI  /  ABOUT</text>
<text x="1165" y="46" text-anchor="end" font-size="12" letter-spacing="2" class="dim">ARTIFICIAL INTELLIGENCE • DATA SCIENCE</text>

<!-- Left identity -->
<text x="52" y="119" font-size="12" letter-spacing="4" class="dim">A LITTLE ABOUT ME</text>
<text x="48" y="177" font-size="52" font-weight="700" class="white">Sadeen</text>
<text x="48" y="232" font-size="52" font-weight="700" class="silver">Abdelalrahman</text>
<path d="M52 253H365" stroke="url(#silver)" stroke-width="2" stroke-linecap="round"/>
<text x="52" y="285" font-size="19" class="white">AI &amp; Data Science Student</text>
<text x="52" y="314" font-size="14" class="dim">Curious mind. Data-driven thinking. Intelligent solutions.</text>

<!-- Organic information chips, not rectangular cards -->
<g>
  <rect x="42" y="350" width="390" height="54" rx="18" class="panel"/>
  <circle cx="68" cy="377" r="11" fill="none" stroke="#c3ccd5" stroke-width="1.5"/>
  <path d="M62 377h12M68 371v12" stroke="#c3ccd5" stroke-width="1.4"/>
  <text x="92" y="371" font-size="11" letter-spacing="2" class="dim">EDUCATION</text>
  <text x="92" y="391" font-size="15" class="white">AI &amp; Data Science Student</text>

  <rect x="42" y="414" width="390" height="54" rx="18" class="panel"/>
  <circle cx="68" cy="441" r="11" fill="none" stroke="#c3ccd5" stroke-width="1.5"/>
  <path d="M62 445V437H74V445M65 433H71" fill="none" stroke="#c3ccd5" stroke-width="1.4"/>
  <text x="92" y="435" font-size="11" letter-spacing="2" class="dim">UNIVERSITY</text>
  <text x="92" y="455" font-size="15" class="white">Al-Zaytoonah University of Jordan</text>

  <rect x="42" y="478" width="390" height="54" rx="18" class="panel"/>
  <circle cx="68" cy="505" r="11" fill="none" stroke="#c3ccd5" stroke-width="1.5"/>
  <path d="M68 497V513M60 505H76M62 499L74 511M74 499L62 511" stroke="#c3ccd5" stroke-width="1"/>
  <text x="92" y="499" font-size="11" letter-spacing="2" class="dim">INTERESTS</text>
  <text x="92" y="519" font-size="14" class="white">ML / Data Science / NLP / Deep Learning</text>

  <rect x="42" y="542" width="390" height="54" rx="18" class="panel"/>
  <circle cx="68" cy="569" r="11" fill="none" stroke="#c3ccd5" stroke-width="1.5"/>
  <path d="M62 573L68 565L74 573M68 565V559" fill="none" stroke="#c3ccd5" stroke-width="1.5"/>
  <text x="92" y="563" font-size="11" letter-spacing="2" class="dim">CURRENTLY EXPLORING</text>
  <text x="92" y="583" font-size="14" class="white">Advanced RAG / XAI / DL Architectures</text>
</g>

<!-- Center holographic neural brain -->
<g class="float">
  <ellipse cx="670" cy="465" rx="205" ry="42" fill="#aab7c5" opacity=".08" filter="url(#blur)"/>
  <ellipse cx="670" cy="270" rx="220" ry="76" fill="none" stroke="#b7c2ce" stroke-opacity=".5" stroke-width="1.5" class="orbit"/>
  <ellipse cx="670" cy="270" rx="190" ry="105" fill="none" stroke="#8593a2" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="8 12" class="orbit2"/>
  <ellipse cx="670" cy="270" rx="160" ry="128" fill="none" stroke="#c5ced7" stroke-opacity=".2" stroke-dasharray="2 9" class="orbit"/>
  <path d="M670 385V463" stroke="#c4d0db" stroke-opacity=".4" stroke-width="2" class="dash"/>
  <ellipse cx="670" cy="466" rx="150" ry="24" fill="#111923" stroke="#8e9aa7" stroke-opacity=".7" stroke-width="2"/>
  <ellipse cx="670" cy="461" rx="112" ry="14" fill="none" stroke="#d3dbe3" stroke-opacity=".75" stroke-width="2" class="pulse"/>
  <ellipse cx="670" cy="456" rx="70" ry="8" fill="#b9c6d3" opacity=".15" filter="url(#blur)"/>

  <!-- Brain outline -->
  <path d="M660 148C624 126 578 150 573 188C538 199 534 240 554 261C533 296 558 334 588 334C595 367 632 376 655 352C681 379 718 367 728 340C765 349 794 319 780 285C807 255 785 215 755 211C748 173 704 143 675 160Z"
        fill="#9eb0c3" fill-opacity=".08" stroke="#d4dce4" stroke-width="2" class="glow"/>
  <g clip-path="url(#brainClip)" fill="none" stroke="#aebdcb" stroke-width="1.25" opacity=".9">
    <path d="M540 205L585 190L620 225L670 180L720 210L765 190L810 230"/>
    <path d="M530 250L575 270L620 225L665 270L720 210L770 260L810 230"/>
    <path d="M545 305L575 270L620 320L665 270L710 325L770 260L800 310"/>
    <path d="M575 350L620 320L665 365L710 325L755 350"/>
    <path d="M585 190L575 270L575 350M620 225L620 320M670 180L665 270L665 365M720 210L710 325M765 190L770 260L755 350"/>
  </g>
  <g fill="#f1f5f8" filter="url(#softGlow)">
    <circle cx="585" cy="190" r="4" class="pulse"/><circle cx="620" cy="225" r="4" class="pulse delay1"/>
    <circle cx="670" cy="180" r="4" class="pulse delay2"/><circle cx="720" cy="210" r="4" class="pulse delay3"/>
    <circle cx="765" cy="190" r="4" class="pulse delay1"/><circle cx="575" cy="270" r="4" class="pulse delay2"/>
    <circle cx="665" cy="270" r="5" class="pulse"/><circle cx="770" cy="260" r="4" class="pulse delay3"/>
    <circle cx="620" cy="320" r="4" class="pulse delay1"/><circle cx="710" cy="325" r="4" class="pulse delay2"/>
    <circle cx="755" cy="350" r="4" class="pulse delay3"/>
  </g>
</g>

<!-- Right-side focus area -->
<path d="M904 112Q904 94 922 94H1146Q1164 94 1164 112V318Q1164 336 1146 336H922Q904 336 904 318Z" class="panel"/>
<text x="936" y="137" font-size="12" letter-spacing="2" class="dim">AREAS OF INTEREST</text>
