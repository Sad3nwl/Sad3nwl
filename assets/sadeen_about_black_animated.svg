  <circle cx="940" cy="262" r="4" fill="#e8edf2"/><text x="958" y="268">Generative AI</text>
  <circle cx="940" cy="306" r="4" fill="#e8edf2"/><text x="958" y="312">NLP / RAG</text>
</g>

<!-- Short personal motto -->
<path d="M900 378H1160" stroke="#687582" stroke-opacity=".5"/>
<text x="1030" y="410" text-anchor="middle" font-size="13" letter-spacing="1.5" class="silver">LEARN CONTINUOUSLY.</text>
<text x="1030" y="434" text-anchor="middle" font-size="13" letter-spacing="1.5" class="silver">BUILD CONSISTENTLY.</text>

<!-- Soft moving scan and subtle particles -->
<rect x="20" y="80" width="1160" height="2" fill="#d7e0e9" opacity=".32" class="scan"/>
<g fill="#e7edf3">
  <circle cx="470" cy="130" r="2" class="twinkle"/><circle cx="840" cy="160" r="2" class="twinkle delay1"/>
  <circle cx="490" cy="390" r="2" class="twinkle delay2"/><circle cx="850" cy="430" r="2" class="twinkle delay3"/>
