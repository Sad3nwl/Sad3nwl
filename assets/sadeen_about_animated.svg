<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Sadeen Abdelalrahman — AI &amp; Data Science</title>
<desc id="desc">Animated neon-blue futuristic AI profile with a holographic neural brain, academic GPA, education, interests, and current learning areas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020817"/><stop offset=".52" stop-color="#061a34"/><stop offset="1" stop-color="#020817"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8beaff"/><stop offset=".48" stop-color="#16baff"/><stop offset="1" stop-color="#176bff"/>
  </linearGradient>
  <radialGradient id="ambient">
    <stop offset="0" stop-color="#087bff" stop-opacity=".28"/><stop offset="1" stop-color="#087bff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#155083" stroke-opacity=".20" stroke-width="1"/>
  </pattern>
  <clipPath id="brainClip"><ellipse cx="670" cy="275" rx="174" ry="126"/></clipPath>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#e7f7ff}
  .cyan{fill:#45d9ff}.muted{fill:#82aaca}
  .panel{fill:#04162c;fill-opacity:.78;stroke:#087ec7;stroke-width:1.4}
  .edge{fill:none;stroke:#19bfff;stroke-width:1.5;filter:url(#glow)}
  .small{font-size:12px;letter-spacing:2px}
  .label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#42d9ff}
  .value{font-size:16px;fill:#d9f3ff}
  .glow{filter:url(#glow)}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .pulse2{animation:pulse 3.2s ease-in-out infinite .8s}
  .spin{transform-origin:670px 275px;animation:spin 24s linear infinite}
  .spinReverse{transform-origin:670px 275px;animation:spin 17s linear infinite reverse}
  .float{animation:float 4s ease-in-out infinite}
  .scan{animation:scan 5s linear infinite}
  .dash{stroke-dasharray:7 11;animation:dash 12s linear infinite}
  .typing{animation:typing 12s steps(1,end) infinite}
  .typing2{animation:typing 12s steps(1,end) 2s infinite}
  .typing3{animation:typing 12s steps(1,end) 4s infinite}
  .typing4{animation:typing 12s steps(1,end) 6s infinite}
  .cursor{animation:blink .8s steps(2,end) infinite}
  .particle{animation:twinkle 2.8s ease-in-out infinite}
  .p2{animation-delay:.7s}.p3{animation-delay:1.4s}.p4{animation-delay:2s}
  @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(420px);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-220}}
  @keyframes typing{0%,8%{opacity:0}12%,82%{opacity:1}90%,100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
</style>

<!-- Background and ambient light -->
<rect width="1200" height="620" rx="18" fill="url(#bg)"/>
<rect width="1200" height="620" rx="18" fill="url(#grid)"/>
<ellipse cx="670" cy="285" rx="390" ry="300" fill="url(#ambient)"/>
<path d="M1 1H1199V619H1Z" fill="none" stroke="#087ec7" stroke-width="2"/>

<!-- Header -->
<path d="M0 68H1200" stroke="#14517e" stroke-width="1"/>
<circle cx="34" cy="34" r="8" fill="#39d8ff" filter="url(#glow)"/>
<circle cx="60" cy="34" r="8" fill="none" stroke="#4da9e8" stroke-width="2"/>
<circle cx="86" cy="34" r="8" fill="none" stroke="#4da9e8" stroke-width="2"/>
<text x="116" y="40" font-size="20" font-weight="700" class="cyan">sadeen@ai: ~/about</text>
<path d="M770 20h20l-16 28h-20z M800 20h20l-16 28h-20z M830 20h20l-16 28h-20z" fill="#14baff"/>
<path d="M870 16H1168L1187 34L1168 52H870L852 34Z" fill="#061a33" stroke="#159fe7" stroke-width="1.5"/>
<text x="1020" y="40" text-anchor="middle" font-size="16" class="cyan">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>

<!-- Left identity panel -->
<path class="panel" d="M22 102H398L420 124V218L398 240H22L10 228V114Z"/>
<text x="42" y="137" class="label">&gt; WHOAMI</text>
<text x="40" y="184" font-size="43" font-weight="700">Sadeen</text>
<text x="40" y="225" font-size="43" font-weight="700" class="cyan glow">Abdelalrahman</text>
<text x="42" y="266" font-size="20" font-weight="600">AI &amp; Data Science Student</text>

<!-- Left details -->
<path class="panel" d="M22 292H414L430 308V526L414 542H22L10 530V304Z"/>
<g>
  <path d="M40 324h24v20H40z M44 318h16v6H44z" fill="none" stroke="#42d9ff" stroke-width="2"/>
  <text x="82" y="330" class="label">$ EDUCATION</text>
  <text x="82" y="354" class="value">AI &amp; Data Science Student</text>
  <path d="M38 372H400" stroke="#14517e"/>
  <path d="M41 393h25v19H41z M45 388h17v5H45z" fill="none" stroke="#42d9ff" stroke-width="2"/>
  <text x="82" y="400" class="label">$ UNIVERSITY</text>
  <text x="82" y="424" class="value">Al-Zaytoonah University of Jordan</text>
  <path d="M38 442H400" stroke="#14517e"/>
  <circle cx="53" cy="472" r="12" fill="none" stroke="#42d9ff" stroke-width="2"/>
  <path d="M53 453v-7 M53 498v-7 M34 472h-7 M79 472h-7" stroke="#42d9ff" stroke-width="2"/>
  <text x="82" y="469" class="label">$ INTERESTS</text>
  <text x="82" y="493" class="value">ML / Data Science / NLP / Deep Learning</text>
  <path d="M38 508H400" stroke="#14517e"/>
  <text x="42" y="531" class="label">$ EXPLORING</text>
  <text x="170" y="531" font-size="14" class="value">Advanced RAG / XAI / DL Architectures</text>
</g>

<!-- Center holographic brain -->
<g class="float">
  <ellipse cx="670" cy="470" rx="220" ry="35" fill="#087bff" opacity=".15" filter="url(#softGlow)"/>
  <path d="M670 404V464 M638 400L638 460 M702 400L702 460" stroke="#1abfff" stroke-opacity=".45" stroke-width="2" class="dash"/>
  <ellipse cx="670" cy="466" rx="176" ry="28" fill="#06264a" stroke="#16baff" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="670" cy="466" rx="133" ry="17" fill="none" stroke="#48dcff" stroke-width="3" class="pulse"/>
  <ellipse cx="670" cy="455" rx="96" ry="12" fill="#20bfff" opacity=".2" filter="url(#softGlow)"/>

  <!-- Orbiting hologram rings -->
  <ellipse cx="670" cy="275" rx="220" ry="68" fill="none" stroke="#14baff" stroke-width="2" opacity=".8" class="spin"/>
  <ellipse cx="670" cy="275" rx="205" ry="91" fill="none" stroke="#1788ff" stroke-width="1.5" stroke-dasharray="15 9" opacity=".8" class="spinReverse"/>
  <ellipse cx="670" cy="275" rx="175" ry="125" fill="none" stroke="#39d8ff" stroke-width="1" stroke-dasharray="3 12" opacity=".65" class="spin"/>

  <!-- Neural brain silhouette and network -->
  <path d="M670 165
    C638 137 591 155 580 190
    C548 190 535 225 550 251
    C524 278 544 321 574 327
    C574 359 609 376 638 358
    C650 383 679 382 688 356
    C718 375 755 355 755 326
    C792 313 802 274 781 250
    C799 214 772 181 742 185
    C724 153 691 146 670 165Z"
    fill="#087bff" fill-opacity=".10" stroke="#36d6ff" stroke-width="2.5" filter="url(#glow)"/>
  <g clip-path="url(#brainClip)" fill="none" stroke="#38cfff" stroke-width="1.2" opacity=".9">
    <path d="M530 205L585 190L620 225L670 180L720 210L765 190L810 230"/>
    <path d="M530 250L575 270L620 225L665 270L720 210L770 260L810 230"/>
    <path d="M545 305L575 270L620 320L665 270L710 325L770 260L800 310"/>
    <path d="M575 350L620 320L665 365L710 325L755 350"/>
    <path d="M585 190L575 270L575 350 M620 225L620 320 M670 180L665 270L665 365 M720 210L710 325 M765 190L770 260L755 350"/>
  </g>
  <g fill="#b7f5ff" filter="url(#glow)">
    <circle cx="585" cy="190" r="4" class="pulse"/><circle cx="620" cy="225" r="5" class="pulse2"/>
    <circle cx="670" cy="180" r="4" class="pulse"/><circle cx="720" cy="210" r="5" class="pulse2"/>
    <circle cx="765" cy="190" r="4" class="pulse"/><circle cx="575" cy="270" r="5" class="pulse2"/>
    <circle cx="665" cy="270" r="6" class="pulse"/><circle cx="770" cy="260" r="5" class="pulse2"/>
    <circle cx="620" cy="320" r="4" class="pulse"/><circle cx="710" cy="325" r="5" class="pulse2"/>
    <circle cx="755" cy="350" r="4" class="pulse"/>
  </g>
  <path d="M670 380V455" stroke="#39d8ff" stroke-width="2" opacity=".5" class="dash"/>
</g>

<!-- Floating data particles -->
<g fill="#7cecff" filter="url(#glow)">
  <circle cx="470" cy="165" r="3" class="particle"/><circle cx="520" cy="120" r="2" class="particle p2"/>
  <circle cx="820" cy="160" r="3" class="particle p3"/><circle cx="850" cy="350" r="2" class="particle p4"/>
  <circle cx="490" cy="390" r="2" class="particle p2"/><circle cx="790" cy="405" r="3" class="particle p3"/>
  <circle cx="680" cy="105" r="2" class="particle p4"/>
</g>

<!-- Right GPA panel -->
<path class="panel" d="M916 102H1168L1188 122V292L1168 312H916L900 296V118Z"/>
<text x="1044" y="139" text-anchor="middle" font-size="20" font-weight="700" class="cyan">&gt;&gt;&gt; ACADEMIC GPA</text>
<circle cx="1044" cy="218" r="68" fill="none" stroke="#123b61" stroke-width="12"/>
<circle cx="1044" cy="218" r="68" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round" stroke-dasharray="388 427" transform="rotate(-90 1044 218)" class="glow"/>
<circle cx="1044" cy="218" r="53" fill="none" stroke="#1c9fe8" stroke-opacity=".6" stroke-dasharray="2 5" class="spin"/>
<text x="1044" y="225" text-anchor="middle" font-size="43" font-weight="700" class="cyan glow">90.9</text>
<text x="1044" y="251" text-anchor="middle" font-size="17" class="muted">/ 100</text>

<!-- Right interests panel -->
<path class="panel" d="M916 332H1168L1188 352V526L1168 546H916L900 530V348Z"/>
<text x="1044" y="368" text-anchor="middle" font-size="19" font-weight="700" class="cyan">AREAS OF INTEREST</text>
<g font-size="17" font-weight="600">
  <rect x="930" y="388" width="228" height="32" rx="16" fill="#08284a" stroke="#159fe7"/>
  <text x="1044" y="410" text-anchor="middle">Machine Learning</text>
  <rect x="930" y="428" width="228" height="32" rx="16" fill="#08284a" stroke="#159fe7"/>
  <text x="1044" y="450" text-anchor="middle">Deep Learning</text>
  <rect x="930" y="468" width="228" height="32" rx="16" fill="#08284a" stroke="#159fe7"/>
  <text x="1044" y="490" text-anchor="middle">Generative AI</text>
  <rect x="930" y="508" width="228" height="32" rx="16" fill="#08284a" stroke="#159fe7"/>
  <text x="1044" y="530" text-anchor="middle">NLP / RAG</text>
</g>

<!-- Animated scanner -->
<rect x="8" y="75" width="1184" height="2" fill="#56e5ff" opacity=".55" class="scan" filter="url(#glow)"/>

<!-- Footer -->
<path d="M0 574H1200" stroke="#14517e"/>
<text x="30" y="602" class="small muted">LEARN CONTINUOUSLY. BUILD CONSISTENTLY.</text>
<text x="1170" y="602" text-anchor="end" class="small cyan">LEARN • EXPLORE • INNOVATE</text>
</svg>
