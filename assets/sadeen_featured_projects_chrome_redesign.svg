  <path d="M670 255v-10h5v10m3 0v-17h5v17m3 0v-7h5v7" fill="none" stroke="#d8dfe5" stroke-width="1.3"/>
  <text x="708" y="244" class="name">CARINSIGHT</text><text x="708" y="262" class="name">DASHBOARD</text>
  <path d="M662 280H898" stroke="#737e89" stroke-opacity=".35"/>
