  <rect x="340" y="174" width="280" height="205" rx="17" fill="none" stroke="url(#shine)" opacity=".6"/>
  <rect class="panelGlow" x="340" y="174" width="280" height="205" rx="17"/>
  <text x="362" y="204" class="cat">02  /  GENERATIVE AI</text>
  <text x="594" y="215" text-anchor="end" class="num">02</text>
