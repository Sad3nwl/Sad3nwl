  <rect x="640" y="174" width="280" height="205" rx="17" fill="none" stroke="url(#shine)" opacity=".6"/>
  <rect class="panelGlow" x="640" y="174" width="280" height="205" rx="17"/>
  <text x="662" y="204" class="cat">03  /  DATA ANALYTICS</text>
