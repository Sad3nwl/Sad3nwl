  <path d="M370 240h18m-18 6h13m-13 6h16" stroke="#d8dfe5" stroke-width="1.3" stroke-linecap="round"/>
  <text x="408" y="244" class="name">ARABIC RAG</text><text x="408" y="262" class="name">WIKIPEDIA</text>
  <path d="M362 280H598" stroke="#737e89" stroke-opacity=".35"/>
  <text x="362" y="305" class="desc">Arabic Retrieval-Augmented</text>
  <text x="362" y="321" class="desc">Generation with source-grounded</text>
  <text x="362" y="337" class="desc">answers from Wikipedia articles.</text>
  <text x="362" y="358" class="tag">LANGCHAIN  ·  CHROMADB</text>
  <text x="362" y="370" class="link">GITHUB / ARABIC-RAG-WIKIPEDIA ↗</text>
</g>

