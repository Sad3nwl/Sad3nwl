<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" role="img" aria-label="About Sadeen Abdelalrahman">
  <style>
    :root{--bg:#071426;--fg:#E6F1FF;--acc:#38BDF8;--mut:#9AB6D3;--line:#244566;--trk:#132B47}
    text{font-family:'Courier New',Courier,monospace;fill:var(--fg)}
    .mut{fill:var(--mut)}
    .bd{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .pill{fill:none;stroke:var(--mut);stroke-width:1}
    .ring{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-dasharray:313 340;transform:rotate(-90deg);transform-origin:670px 150px;animation:ring 2.2s ease-out forwards}
    @keyframes ring{from{stroke-dasharray:0 340}to{stroke-dasharray:313 340}}
    .typing{opacity:0;animation:show 18s infinite}
    .t1{animation-delay:1.0s}.t2{animation-delay:3.6s}.t3{animation-delay:6.2s}.t4{animation-delay:8.8s}.t5{animation-delay:11.4s}.t6{animation-delay:14s}
    @keyframes show{0%,5%{opacity:0}8%,85%{opacity:1}90%,100%{opacity:0}}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{opacity:0}}
  </style>
  <defs>
    <radialGradient id="vg" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="1" stop-color="#1D75C9" stop-opacity=".24"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="818" height="343" rx="3" fill="#071426"/>
  <rect x="1" y="1" width="818" height="343" rx="3" fill="url(#vg)"/>
  <rect class="bd" pathLength="1" x="2" y="2" width="816" height="341" rx="3"/>
  <rect x="7" y="7" width="806" height="331" rx="2" fill="none" stroke="#244566"/>
  <line x1="1" y1="44" x2="819" y2="44" stroke="#244566"/>
  <line x1="520" y1="44" x2="520" y2="344" stroke="#244566"/>

  <circle cx="26" cy="22" r="5" fill="#38BDF8"/>
  <circle cx="46" cy="22" r="5" fill="none" stroke="#9AB6D3"/>
  <circle cx="66" cy="22" r="5" fill="none" stroke="#9AB6D3"/>
  <text class="mut" style="font-size:11px" x="90" y="26">sadeen@ai: ~/about</text>
  <text class="mut" style="font-size:11px" x="670" y="26" text-anchor="middle">ACADEMIC GPA</text>

  <text style="font-size:13px" x="28" y="84"><tspan class="mut">$ </tspan>whoami</text>
  <text class="typing t1" style="font-size:13px" x="46" y="107">→ Sadeen Abdelalrahman</text>

  <text style="font-size:13px" x="28" y="132"><tspan class="mut">$ </tspan>education</text>
  <text class="typing t2" style="font-size:13px" x="46" y="155">→ AI &amp; Data Science Student</text>

  <text style="font-size:13px" x="28" y="180"><tspan class="mut">$ </tspan>university</text>
  <text class="typing t3" style="font-size:12px" x="46" y="203">→ Al-Zaytoonah University of Jordan</text>

  <text style="font-size:13px" x="28" y="228"><tspan class="mut">$ </tspan>interests</text>
  <text class="typing t4" style="font-size:12px" x="46" y="251">→ ML / Data Science / NLP / Deep Learning</text>

  <text style="font-size:13px" x="28" y="276"><tspan class="mut">$ </tspan>exploring</text>
  <text class="typing t5" style="font-size:12px" x="46" y="299">→ Advanced RAG / XAI / DL Architectures</text>

  <text class="mut" style="font-size:13px" x="28" y="326">$ </text>
  <text style="font-size:12px" x="46" y="326">Learn continuously. Build consistently.</text>
  <rect class="cursor" x="302" y="312" width="8" height="16" fill="#38BDF8"/>

  <circle cx="670" cy="150" r="76" fill="none" stroke="#244566" stroke-dasharray="2 7"/>
  <circle cx="670" cy="150" r="54" fill="none" stroke="#132B47" stroke-width="6"/>
  <circle class="ring" cx="670" cy="150" r="54"/>
  <text x="670" y="158" text-anchor="middle" style="font-size:29px;font-weight:700">90.9</text>
  <text class="mut" style="font-size:11px" x="670" y="176" text-anchor="middle">/ 100</text>

  <g class="pulse">
    <rect class="pill" x="548" y="250" width="120" height="22" rx="3"/>
    <text class="mut" style="font-size:10.5px" x="608" y="265" text-anchor="middle">Machine Learning</text>
  </g>
  <g class="pulse" style="animation-delay:.5s">
    <rect class="pill" x="676" y="250" width="120" height="22" rx="3"/>
    <text class="mut" style="font-size:10.5px" x="736" y="265" text-anchor="middle">Deep Learning</text>
  </g>
  <g class="pulse" style="animation-delay:1s">
    <rect class="pill" x="548" y="280" width="120" height="22" rx="3"/>
    <text class="mut" style="font-size:10.5px" x="608" y="295" text-anchor="middle">Generative AI</text>
  </g>
  <g class="pulse" style="animation-delay:1.5s">
    <rect class="pill" x="676" y="280" width="120" height="22" rx="3"/>
    <text class="mut" style="font-size:10.5px" x="736" y="295" text-anchor="middle">NLP / RAG</text>
  </g>
  <text class="mut" style="font-size:10.5px" x="670" y="327" text-anchor="middle">Artificial Intelligence &amp; Data Science</text>
</svg>