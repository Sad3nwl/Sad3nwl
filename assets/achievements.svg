<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="Certifications, Leadership and Achievements">

<style>
:root {
  --bg: #0b192c;
  --fg: #e0f4ff;
  --acc: #00b4d8;
  --mut: #90e0ef;
  --line: #1d3557;
  --trk: #1e3a5f;
}

text {
  font-family: 'Courier Prime', 'Special Elite', 'Courier New', Courier, monospace;
  fill: var(--fg);
}

.mut { fill: var(--mut); }

.fade {
  opacity: 0;
  animation: in .8s ease forwards;
}

@keyframes in { to { opacity: 1; } }

.bd {
  fill: none;
  stroke: var(--acc);
  stroke-width: 1.6;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 2.2s ease forwards;
}

@keyframes draw { to { stroke-dashoffset: 0; } }

.pill {
  fill: none;
  stroke: var(--mut);
  stroke-width: 1;
}

.up {
  animation: up .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.pop {
  animation: pop 2.6s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes pop {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
</style>

<defs>
  <radialGradient id="vg" cx=".5" cy=".5" r=".78">
    <stop offset=".55" stop-color="#0077b6" stop-opacity="0" />
    <stop offset="1" stop-color="#0077b6" stop-opacity=".25" />
  </radialGradient>

  <filter id="gr" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" />
    <feColorMatrix values="0 0 0 0 .04 0 0 0 0 .1 0 0 0 0 .18 1.2 0 0 0 -.5" />
  </filter>
</defs>

<!-- 1. Leadership: Event Organizer -->
<g class="up" style="animation-delay:0.1s">
  <rect x="10" y="10" width="190" height="152" rx="3" fill="#0b192c" />
  <rect x="10" y="10" width="190" height="152" rx="3" fill="url(#vg)" />
  <rect class="bd" pathLength="1" x="11" y="11" width="188" height="150" rx="3" style="stroke:#00b4d8" />
  <rect x="15" y="15" width="180" height="142" rx="2" fill="none" stroke="#1d3557" stroke-width="1" />

  <g transform="translate(26,24)">
    <path fill="none" stroke="#e0f4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 6 h12 v16 h-12 z" />
    <path fill="none" stroke="#e0f4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M16 22 v6 m-5 0 h10" />
    <circle class="pop" cx="16" cy="14" r="3" fill="#00b4d8" />
  </g>

  <rect class="pill" x="138" y="24" width="50" height="20" rx="3" />
  <text class="mut" style="font-size:9px" x="163" y="38" text-anchor="middle">LEAD</text>

  <text style="font-size:12px;font-weight:700" x="26" y="86">Event Organizer</text>
  <text class="mut" style="font-size:10px" x="26" y="102">Al-Zaytoonah Univ.</text>

  <line x1="26" y1="118" x2="184" y2="118" stroke="#1d3557" />
  <text class="mut" style="font-size:9px" x="26" y="136">University Leadership</text>

  <rect x="10" y="10" width="190" height="152" rx="3" fill="#000" filter="url(#gr)" opacity=".4" />
</g>

