<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Sadeen's Featured Projects">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050505"/>
    <stop offset=".55" stop-color="#111111"/>
    <stop offset="1" stop-color="#1D1D1D"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2F2F2"/>
    <stop offset=".48" stop-color="#A8A8A8"/>
    <stop offset="1" stop-color="#666666"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#191919"/>
    <stop offset="1" stop-color="#0B0B0B"/>
  </linearGradient>
  <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r=".7" fill="#777" opacity=".22"/>
  </pattern>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#EEEEEE}
    .muted{fill:#858585}
    .silver{fill:#D6D6D6}
    .card{fill:url(#panel);stroke:#454545;stroke-width:1}
    .heading{font-size:13px;font-weight:700;letter-spacing:.45px;fill:#F0F0F0}
    .desc{font-size:11px;fill:#BDBDBD}
    .tag{font-size:9px;fill:#D0D0D0;letter-spacing:.25px}
    .small{font-size:9px;letter-spacing:1.25px}
    .project{opacity:0;animation:rise .75s ease forwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .edge{fill:none;stroke:url(#silver);stroke-width:1.2;stroke-dasharray:28 420;animation:edge 7s linear infinite;opacity:.75}
    @keyframes edge{to{stroke-dashoffset:-448}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(650px)}}
    .number{font-size:25px;font-weight:300;fill:#BEBEBE}
    .rule{stroke:#414141;stroke-width:1}
  </style>
</defs>

<rect width="900" height="650" rx="26" fill="url(#bg)"/>
<rect width="900" height="650" rx="26" fill="url(#grain)"/>
<!-- Header -->
<path d="M28 28H872V104H28Z" fill="#0A0A0A" stroke="#3B3B3B"/>
<path d="M28 28H38V104H28Z" fill="url(#silver)"/>
<text x="58" y="61" font-size="21" font-weight="700" letter-spacing="2.2">FEATURED PROJECTS</text>
<text x="59" y="83" class="small muted">EXPLORING AI · DATA SCIENCE · SOFTWARE DEVELOPMENT</text>
<text x="850" y="55" text-anchor="end" class="small muted">PORTFOLIO // 2026</text>
<text x="850" y="80" text-anchor="end" class="small silver">06 PROJECTS LOADED</text>
<circle cx="865" cy="91" r="3" fill="#E5E5E5" class="pulse"/>

<!-- Project 1 -->
<g class="project" style="animation-delay:.1s">
