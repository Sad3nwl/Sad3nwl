<path d="M28 610H872" stroke="#555" stroke-width="1"/>
<text x="30" y="632" class="small muted">THINK // EXPERIMENT // BUILD // INNOVATE</text>
<text x="870" y="632" text-anchor="end" class="small silver">PROJECTS STATUS: ACTIVE</text>
