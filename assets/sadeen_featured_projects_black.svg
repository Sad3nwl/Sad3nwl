 <path d="M103 166V249" class="rule"/>
 <text x="123" y="178" class="heading">BRAIN TUMOR DETECTION &amp; XAI</text>
 <text x="123" y="204" class="desc">Brain tumor classification using</text>
 <text x="123" y="220" class="desc">MobileNetV2 Transfer Learning,</text>
 <text x="123" y="236" class="desc">with Grad-CAM explainability.</text>
 <text x="123" y="263" class="tag">MOBILENETV2 · GRAD-CAM</text>
 <text x="438" y="263" text-anchor="end" class="small silver">GITHUB / BRAIN-TUMOR-DETECTION ↗</text>
</g>

